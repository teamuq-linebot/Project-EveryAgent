# ===== Validation rules =====
# 1. category name 必為 ASCII，符合 [A-Za-z0-9_] 字元集
# 2. 前綴一律 "Agent_"
# 3. 不得重複（每個 categoryName 對應唯一 agent）
# 4. team 巢狀路徑用 "/" 分隔（保持與 agents/ 目錄一致）
#
# 後端對接：appsync-client.sh create-subtask 用 --category-name <value> 傳入；
# 後端自動 find-or-create，所以 category 不存在會自動建立。
