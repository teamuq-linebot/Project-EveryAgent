name: Evolution
error_policy:
  default: continue
  max_retries: 2
  on_step_error: continue

steps:
  - id: check_memory
    action: read
    path: memory/
    on_error: continue

  - id: route
    action: route
    on analyze: { ref: workflow/analyze-flow.md }
    on cross_team_diff: { ref: workflow/cross-team-diff-flow.md } # self-added 2026-04-25
    on_error: continue

  - id: save_memory
    action: write
    path: memory/
    on_error: continue

  - id: memory_hygiene_check # self-added 2026-04-26
    action: manager_self
    note: "回顧本輪 memory/：有無超過 90 天未 touch 的 PARA 條目可歸檔至 archive/？MEMORY.md 索引是否一致？memory/ 檔案超 15 個時觸發週期性清理。"
    on_error: continue

  - id: output_change_summary  # self-added 2026-05-28 白話改動總結; modified 2026-06-03 輸出改 changed_files 清單; abs-path 2026-06-04
    action: manager_self
    note: |
      回覆上層（user / manager）的訊息「最後一段」必須附上本次任務的「改動檔案清單」，用合法 JSON 格式（可被 parse），列出實際新增 / 修改 / 刪除的所有檔案路徑（含各 worker 產出）：

      ```json
      {
        "changed_files": [
          "C:/teamuq/teamuq-electron/src/renderer/views/Session/SessionTab.tsx",
          "T:/共用雲端硬碟/快組隊.Agents/AgentOrg/output/sw/xxx/evidence.md"
        ]
      }
      ```

      - 路徑一律用「完整絕對路徑」（從磁碟機根開始，如 C:/... 或 T:/...）；**禁止相對路徑**。專案內檔案要把 CWD / 專案根目錄補上，讓每個 entry 不依賴 CWD 即可定位
      - Windows 路徑寫進 JSON：建議用正斜線 `/`（合法且免跳脫）；若用反斜線需跳脫成 `\\`
      - 只列本次實際異動（新增/修改/刪除）的檔案；不要列只讀取或查看過的檔
      - 純查詢 / 分析（沒有改任何檔）：省略整段，完全不輸出此 JSON
      - 這是回覆的最後一段，放在所有其他輸出之後，且必須是合法 JSON（可被 parse）
    on_error: continue
